<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGuard Portal - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your email to receive a recovery link</p>

        <!-- Message Alerts -->
        <div id="messageBox" class="message"></div>

        <form id="forgotForm" onsubmit="handleForgot(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="Enter your registered email">
            </div>

            <button type="submit" id="resetBtn" class="btn">Send Recovery Email</button>
        </form>

        <div class="footer-links" style="justify-content: center;">
            <a href="index.html" id="loginLink">Back to Login</a>
        </div>
    </div>

    <script>
        function handleForgot(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const messageBox = document.getElementById('messageBox');

            if (!email) {
                messageBox.className = "message error";
                messageBox.innerText = "Email address is required";
                messageBox.style.display = "block";
                return;
            }

            if (!email.includes('@') || email.length < 5) {
                messageBox.className = "message error";
                messageBox.innerText = "Please enter a valid email address";
                messageBox.style.display = "block";
                return;
            }

            messageBox.className = "message success";
            messageBox.innerText = "Recovery link sent! Please check your email inbox.";
            messageBox.style.display = "block";
        }
    </script>
</body>
</html>
